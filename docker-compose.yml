services:
  db:
    image: postgres:16-alpine
    container_name: simplehelp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required — see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: simplehelp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required — see .env.example}
      DB_PORT: ${DB_PORT:?DB_PORT is required — see .env.example}
      DB_USER: ${DB_USER:?DB_USER is required — see .env.example}
      DB_PASS: ${DB_PASS:?DB_PASS is required — see .env.example}
      DB_NAME: ${DB_NAME:?DB_NAME is required — see .env.example}
      PORT: "8080"
      # JWT_SECRET must be provided via .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: simplehelp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    container_name: simplehelp-test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required — see .env.example}
      DB_PORT: ${DB_PORT:?DB_PORT is required — see .env.example}
      DB_USER: ${DB_USER:?DB_USER is required — see .env.example}
      DB_PASS: ${DB_PASS:?DB_PASS is required — see .env.example}
      DB_NAME: ${DB_NAME:?DB_NAME is required — see .env.example}
      PORT: "8080"
    # The test stage's CMD applies migrations then runs `go test ./...`.
    # To pass extra go test flags, override the command (see README).

volumes:
  pgdata:
