services:
  db:
    image: postgres:16-alpine
    container_name: simplehelp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplehelp
      POSTGRES_USER: simplehelp
      POSTGRES_PASSWORD: simplehelp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplehelp -d simplehelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: simplehelp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: simplehelp
      DB_PASS: simplehelp
      DB_NAME: simplehelp
      PORT: "8080"
      # JWT_SECRET should be set to a strong random value in production.
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    container_name: simplehelp-test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: simplehelp
      DB_PASS: simplehelp
      DB_NAME: simplehelp
      PORT: "8080"
    # The test stage's CMD applies migrations then runs `go test ./...`.
    # To pass extra go test flags, override the command (see README).

volumes:
  pgdata:
